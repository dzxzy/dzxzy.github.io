<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋仔派对赛季动画视频库 | 蛋仔小鄒呀</title>
    <link rel="preload" as="image" href="assets/bg.jpg">
    <style>
        :root {
            --bg-url: url('assets/bg.jpg');
            --card-bg: rgba(30,45,70,0.7);
            --text-color: #eef2ff;
            --title-color: #ffd966;
            --border-color: rgba(255,215,0,0.3);
        }
        body.dark {
            background: var(--bg-url) center center / cover no-repeat fixed;
            background-color: #0a0f1a;
            --card-bg: rgba(30,45,70,0.7);
            --text-color: #eef2ff;
            --title-color: #ffd966;
            --border-color: rgba(255,215,0,0.3);
        }
        body.light {
            background: #f0f2f5;
            --card-bg: rgba(245,245,255,0.85);
            --text-color: #1f2d3d;
            --title-color: #0366d6;
            --border-color: rgba(100,100,150,0.4);
        }
        body {
            font-family: system-ui, sans-serif;
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(20,30,55,0.65);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            border: 1px solid var(--border-color);
        }
        .header-bar h1 { font-size: 1.6rem; color: #ffd966; }
        .back-link {
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            color: var(--text-color);
        }
        .theme-switch {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .search-input {
            width: 100%;
            max-width: 400px;
            background: rgba(30,45,70,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            padding: 0.7rem 1.2rem;
            font-size: 1rem;
            color: var(--text-color);
            outline: none;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }
        .video-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            opacity: 0;
            transform: translateY(60px);
            transition: transform 0.5s, opacity 0.5s;
            border: 1px solid var(--border-color);
        }
        .video-card.animate-in {
            opacity: 1;
            transform: translateY(0);
        }
        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
        }
        .video-card video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            pointer-events: none;
        }
        .video-info {
            padding: 1rem;
        }
        .video-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--title-color);
        }
        .video-desc {
            font-size: 0.85rem;
            color: #c0d0ff;
            margin: 0.5rem 0;
        }
        .download-btn {
            display: inline-block;
            background: #2a5f8a;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.8rem;
            pointer-events: auto;
        }
        .easter-egg {
            background: rgba(40,60,90,0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            border-left: 5px solid #ffd966;
        }
        .easter-egg img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
        }
        .easter-egg .info h4 {
            font-size: 1.1rem;
            color: #ffd966;
        }
        .no-result {
            text-align: center;
            padding: 2rem;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: rgba(30,45,70,0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            max-width: 1000px;
            width: 90%;
            padding: 20px;
            position: relative;
            border: 1px solid var(--border-color);
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: white;
            z-index: 10;
        }
        .modal-body {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .modal-video-container {
            flex: 2;
            min-width: 250px;
        }
        .modal-video {
            width: 100%;
            border-radius: 20px;
            background: #000;
        }
        .modal-info {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 1rem;
        }
        .modal-info h3 {
            color: #ffd966;
            margin-bottom: 0.5rem;
        }
        @media (max-width: 640px) {
            .modal-body { flex-direction: column; }
            .easter-egg { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <h1>🎬 蛋仔派对赛季动画视频库</h1>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div class="theme-switch" id="themeToggle">🌙 黑夜</div>
            <a href="/" class="back-link">← 返回主页</a>
        </div>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索视频标题">
    </div>
    <div id="videoContainer" class="video-grid"></div>
    <footer>所有视频可预览下载 | 搜索特定关键词有惊喜</footer>
</div>

<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <div class="modal-body">
            <div class="modal-video-container">
                <video id="modalVideo" class="modal-video" controls></video>
            </div>
            <div class="modal-info">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>
</div>

<script>
    // 日夜模式（与主站逻辑一致，使用localStorage同步）
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
        if (theme === 'light') {
            document.body.classList.remove('dark');
            document.body.classList.add('light');
            themeToggle.innerHTML = '☀️ 白天';
            localStorage.setItem('theme', 'light');
        } else {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
            themeToggle.innerHTML = '🌙 黑夜';
            localStorage.setItem('theme', 'dark');
        }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setTheme('light');
    else setTheme('dark');
    themeToggle.addEventListener('click', () => {
        if (document.body.classList.contains('dark')) setTheme('light');
        else setTheme('dark');
    });

    // 视频数据
    const normalVideos = [
        { title: "怪奇工厂", description: "暂无介绍", fileName: "S01-怪奇工厂.mp4" },
        { title: "S02-惊奇游乐园", description: "暂无介绍", fileName: "S02-惊奇游乐园.mp4" },
        { title: "S03-疯狂马戏团", description: "暂无介绍", fileName: "S03-疯狂马戏团.mp4" },
        { title: "S04-汪汪向前冲", description: "我要用速度战胜一切", fileName: "S04-汪汪向前冲.mp4" },
        { title: "S05-糖果甜心", description: "暂无介绍", fileName: "S05-糖果甜心.mp4" },
        { title: "S06-蛋糕蜜语", description: "传说,在一个甜蜜的午后……", fileName: "S06-蛋糕蜜语.mp4" },
        { title: "S07-音乐星企划", description: "准备好让心跳加速了吗！", fileName: "S07-音乐星企划.mp4" },
        { title: "S08-精灵之声", description: "自从曜星离开后，我以为，世界上不会再有音乐了……", fileName: "S08-精灵之声.mp4" },
        { title: "S09-勇闯龙蛋岛", description: "暂无介绍", fileName: "S09-勇闯龙蛋岛.mp4" },
        { title: "S10-太空奇遇", description: "暂无介绍", fileName: "S10-太空奇遇.mp4" },
        { title: "S11-梦幻星遇", description: "那些深满内心的恐惧，总会以梦的形式再次出现……", fileName: "S11-梦幻星遇.mp4" },
        { title: "S12-寻秘狂欢", description: "欢迎来到狂欢节", fileName: "S12-寻秘狂欢.mp4" },
        { title: "S13-午夜魅影", description: "午夜剧院，欢迎所有迷路的灵魂……", fileName: "S13-午夜魅影.mp4" },
        { title: "S14-寻光冰雪", description: "又梦见了冰原的冬日……", fileName: "S14-寻光冰雪.mp4" },
        { title: "S15-玩具历险", description: "怀揣着梦想而来的小蛋仔，请许下你的愿望……", fileName: "S15-玩具历险.mp4" },
        { title: "S16-潮玩大作战", description: "这些被改造的玩具，最后都去了哪里……", fileName: "S16-潮玩大作战.mp4" },
        { title: "S17-宝船拍卖夜", description: "载满了珍宝的游船，现在已为你靠岸……", fileName: "S17-宝船拍卖夜.mp4" },
        { title: "S18-深海逐金宴", description: "几乎所有的罪恶，都来源于全能的黄金……", fileName: "S18-深海逐金宴.mp4" },
        { title: "S19-圆月哥特", description: "十五天后，我会被那些家伙撕碎……", fileName: "S19-圆月哥特.mp4" },
        { title: "S20-龙与剑之诗", description: "我重生了……", fileName: "S20-龙与剑之诗.mp4" },
        { title: "S21-时之回响", description: "时针，指向二十一点前……", fileName: "S21-时之回响.mp4" },
        { title: "S22-金字塔传奇", description: "不知从何时开始，神明抛弃了我们……", fileName: "S22-金字塔传奇.mp4" },
        { title: "S23-绘梦校园", description: "平静的校园里，藏着多少秘密……", fileName: "S23-绘梦校园.mp4" },
        { title: "S24-蜜糖海迷踪", description: "传说，在一个甜蜜的午后……*2", fileName: "S24-蜜糖海迷踪.mp4" },
        { title: "S25-博物馆狂想", description: "好漂亮的王冠……（呃啊，我的屁股！）", fileName: "S25-博物馆狂想.mp4" },
        { title: "S26-国宝归乡", description: "时间，是顽固的错觉……", fileName: "S26-国宝归乡.mp4" },
        { title: "S27-织梦寻星", description: "欢迎光临，尊敬的客人", fileName: "S27-织梦寻星.mp4" },
        { title: "S28-奇迹大马戏", description: "爸爸说，当天空落下第一片雪花，他就会回家。", fileName: "S28-奇迹大马戏.mp4" },
        { title: "S29-心动魔法", description: "魔法少女，变身！", fileName: "S29-心动魔法.mp4" },
        { title: "S30-元气零食", description: "热量在沸腾，美味在尖叫！", fileName: "S30-元气零食.mp4" }
    ];

    const easterEggs = [
        { keyword: "一周年", title: "🎂 蛋仔派对一周年", content: "蛋仔派对一周年大合照", img: "assets/yzn.jpg" },
        { keyword: "二周年", title: "🎂 蛋仔派对二周年", content: "蛋仔派对二周年庆典", img: "assets/ezn.jpg" },
        { keyword: "三周年", title: "🎂 蛋仔派对三周年", content: "蛋仔派对三周年狂欢", img: "assets/szn.jpg" }
    ];

    const VIDEO_BASE_PATH = "videos/";
    let currentFilterText = "";

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }

    function renderContent() {
        const container = document.getElementById('videoContainer');
        const keyword = currentFilterText.toLowerCase().trim();
        const matchedEaster = easterEggs.filter(egg => egg.keyword === keyword);
        if (matchedEaster.length > 0) {
            let html = '<div style="grid-column:1/-1;">';
            matchedEaster.forEach(egg => {
                html += `
                    <div class="easter-egg">
                        <img src="${egg.img}" alt="彩蛋图片" onerror="this.src='https://via.placeholder.com/80?text=Image'">
                        <div class="info">
                            <h4>${escapeHtml(egg.title)}</h4>
                            <p>${escapeHtml(egg.content)}</p>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
            return;
        }

        const filtered = normalVideos.filter(v => 
            v.title.toLowerCase().includes(keyword) || v.description.toLowerCase().includes(keyword)
        );
        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-result">😭 没有找到相关视频</div>';
            return;
        }
        let html = '';
        for (let v of filtered) {
            const videoUrl = VIDEO_BASE_PATH + v.fileName;
            html += `
                <div class="video-card" data-video-url="${videoUrl}" data-title="${escapeHtml(v.title)}" data-desc="${escapeHtml(v.description)}">
                    <video preload="none" poster="">
                        <source data-src="${videoUrl}" type="video/mp4">
                    </video>
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(v.title)}</div>
                        <div class="video-desc">${escapeHtml(v.description)}</div>
                        <a href="${videoUrl}" download class="download-btn">⬇️ 下载</a>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        initLazyLoadAndAnimation();
        bindModalClick();
    }

    function initLazyLoadAndAnimation() {
        const cards = document.querySelectorAll('.video-card');
        if (!cards.length) return;
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const videoEl = card.querySelector('video');
                    const sourceEl = videoEl?.querySelector('source');
                    const dataSrc = sourceEl?.getAttribute('data-src');
                    if (dataSrc && !videoEl.src) {
                        sourceEl.setAttribute('src', dataSrc);
                        videoEl.load();
                        videoEl.preload = 'metadata';
                        sourceEl.removeAttribute('data-src');
                    }
                    if (!card.classList.contains('animate-in')) {
                        card.classList.add('animate-in');
                    }
                    observer.unobserve(card);
                }
            });
        }, { rootMargin: "100px" });
        cards.forEach(card => observer.observe(card));
    }

    function bindModalClick() {
        const modal = document.getElementById('videoModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const closeModal = document.querySelector('.modal-close');
        const cards = document.querySelectorAll('.video-card');
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.closest('.download-btn')) return;
                const videoUrl = card.getAttribute('data-video-url');
                const title = card.getAttribute('data-title');
                const desc = card.getAttribute('data-desc');
                if (videoUrl) {
                    modalVideo.src = videoUrl;
                    modalTitle.innerText = title;
                    modalDesc.innerText = desc;
                    modal.style.display = 'flex';
                    modalVideo.play();
                }
            });
        });
        if (!window.modalBound) {
            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
                modalVideo.pause();
                modalVideo.src = '';
            });
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    modalVideo.pause();
                    modalVideo.src = '';
                }
            });
            window.modalBound = true;
        }
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function(e) {
        currentFilterText = e.target.value;
        renderContent();
    });

    renderContent();
</script>
</body>
</html>
