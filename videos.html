<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋仔派对赛季动画视频库 | 蛋仔小鄒呀</title>
    <link rel="preload" as="image" href="assets/bg.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: url('assets/bg.jpg') center center / cover no-repeat fixed;
            background-color: #0a0f1a;
            padding: 20px;
            color: #eef2ff;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(20, 30, 55, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .header-bar h1 {
            font-size: 1.6rem;
            color: #ffd966;
        }
        .back-link {
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            color: #eef2ff;
            font-weight: 500;
            transition: 0.2s;
        }
        .back-link:hover {
            background: rgba(255,215,0,0.3);
        }
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .search-input {
            width: 100%;
            max-width: 400px;
            background: rgba(30,45,70,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 60px;
            padding: 0.7rem 1.2rem;
            font-size: 1rem;
            color: #eef2ff;
            outline: none;
            transition: 0.2s;
        }
        .search-input::placeholder {
            color: #b0c4ff;
        }
        .search-input:focus {
            border-color: #ffd966;
            background: rgba(40,60,90,0.9);
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }
        .video-card {
            background: rgba(30,45,70,0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            transition: transform 0.35s ease, box-shadow 0.35s;
            border: 1px solid rgba(255,215,0,0.25);
            opacity: 0;
            transform: translateY(60px) scale(0.96);
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.5s ease;
            cursor: pointer;
        }
        .video-card.animate-in {
            opacity: 1 !important;
            transform: translateY(0) scale(1) !important;
        }
        .video-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 25px 35px rgba(0,0,0,0.5);
            background: rgba(50,70,100,0.85);
            border-color: rgba(255,215,0,0.6);
        }
        video {
            width: 100%;
            background: #000;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            pointer-events: none; /* 点击卡片时触发弹窗，而不是播放控件 */
        }
        .video-info {
            padding: 1rem;
        }
        .video-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #ffefc0;
        }
        .video-desc {
            font-size: 0.85rem;
            color: #c0d0ff;
            margin-bottom: 1rem;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #2a5f8a;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: background 0.2s;
            pointer-events: auto; /* 下载按钮可独立点击 */
        }
        .download-btn:hover {
            background: #3a7faa;
        }
        footer {
            margin-top: 2.5rem;
            text-align: center;
            color: #8b9ac0;
            border-top: 1px solid rgba(255,215,0,0.2);
            padding-top: 1.5rem;
        }
        .no-result {
            text-align: center;
            grid-column: 1 / -1;
            padding: 2rem;
            font-size: 1.2rem;
            color: #ffd966;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1f2e;
            border-radius: 24px;
            max-width: 800px;
            width: 90%;
            padding: 20px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: white;
        }
        .modal-video {
            width: 100%;
            border-radius: 16px;
        }
        @media (max-width: 640px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .header-bar {
                flex-direction: column;
                text-align: center;
            }
            .search-input {
                max-width: 100%;
            }
            .modal-content { width: 95%; padding: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <h1>🎬 蛋仔派对赛季动画视频库</h1>
        <a href="/" class="back-link">← 返回主页</a>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索视频标题 (如: 龙与剑、元气零食)">
    </div>
    <div id="videoContainer" class="video-grid">
        <div style="text-align:center; padding:2rem;">加载素材中...</div>
    </div>
    <footer>所有视频可直接预览或点击下载 | 持续更新中</footer>
</div>

<!-- 模态框 -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <video id="modalVideo" class="modal-video" controls autoplay></video>
    </div>
</div>

<script>
    const videoList = [
        { title: "怪奇工厂", description: "暂无介绍", fileName: "S01-怪奇工厂.mp4" },
        { title: "S02-惊奇游乐园", description: "暂无介绍", fileName: "S02-惊奇游乐园.mp4" },
        { title: "S03-疯狂马戏团", description: "暂无介绍", fileName: "S03-疯狂马戏团.mp4" },
        { title: "S04-汪汪向前冲", description: "我要用速度战胜一切", fileName: "S04-汪汪向前冲.mp4" },
        { title: "S05-糖果甜心", description: "暂无介绍", fileName: "S05-糖果甜心.mp4" },
        { title: "S06-蛋糕蜜语", description: "传说,在一个甜蜜的午后……", fileName: "S06-蛋糕蜜语.mp4" },
        { title: "S07-音乐星企划", description: "准备好让心跳加速了吗！", fileName: "S07-音乐星企划.mp4" },
        { title: "S08-精灵之声", description: "自从曜星离开后，我以为，世界上不会再有音乐了……", fileName: "S08-精灵之声.mp4" },
        { title: "S09-勇闯龙蛋岛", description: "暂无介绍", fileName: "S09-勇闯龙蛋岛.mp4" },
        { title: "S10-太空奇遇", description: "暂无介绍", fileName: "S10-太空奇遇.mp4" },
        { title: "S11-梦幻星遇", description: "那些深满内心的恐惧，总会以梦的形式再次出现……", fileName: "S11-梦幻星遇.mp4" },
        { title: "S12-寻秘狂欢", description: "欢迎来到狂欢节", fileName: "S12-寻秘狂欢.mp4" },
        { title: "S13-午夜魅影", description: "午夜剧院，欢迎所有迷路的灵魂……", fileName: "S13-午夜魅影.mp4" },
        { title: "S14-寻光冰雪", description: "又梦见了冰原的冬日……", fileName: "S14-寻光冰雪.mp4" },
        { title: "S15-玩具历险", description: "怀揣着梦想而来的小蛋仔，请许下你的愿望……", fileName: "S15-玩具历险.mp4" },
        { title: "S16-潮玩大作战", description: "这些被改造的玩具，最后都去了哪里……", fileName: "S16-潮玩大作战.mp4" },
        { title: "S17-宝船拍卖夜", description: "载满了珍宝的游船，现在已为你靠岸……", fileName: "S17-宝船拍卖夜.mp4" },
        { title: "S18-深海逐金宴", description: "几乎所有的罪恶，都来源于全能的黄金……", fileName: "S18-深海逐金宴.mp4" },
        { title: "S19-圆月哥特", description: "十五天后，我会被那些家伙撕碎……", fileName: "S19-圆月哥特.mp4" },
        { title: "S20-龙与剑之诗", description: "我重生了……", fileName: "S20-龙与剑之诗.mp4" },
        { title: "S21-时之回响", description: "时针，指向二十一点前……", fileName: "S21-时之回响.mp4" },
        { title: "S22-金字塔传奇", description: "不知从何时开始，神明抛弃了我们……", fileName: "S22-金字塔传奇.mp4" },
        { title: "S23-绘梦校园", description: "平静的校园里，藏着多少秘密……", fileName: "S23-绘梦校园.mp4" },
        { title: "S24-蜜糖海迷踪", description: "传说，在一个甜蜜的午后……*2", fileName: "S24-蜜糖海迷踪.mp4" },
        { title: "S25-博物馆狂想", description: "好漂亮的王冠……（呃啊，我的屁股！）", fileName: "S25-博物馆狂想.mp4" },
        { title: "S26-国宝归乡", description: "时间，是顽固的错觉……", fileName: "S26-国宝归乡.mp4" },
        { title: "S27-织梦寻星", description: "欢迎光临，尊敬的客人", fileName: "S27-织梦寻星.mp4" },
        { title: "S28-奇迹大马戏", description: "爸爸说，当天空落下第一片雪花，他就会回家。", fileName: "S28-奇迹大马戏.mp4" },
        { title: "S29-心动魔法", description: "魔法少女，变身！", fileName: "S29-心动魔法.mp4" },
        { title: "S30-元气零食", description: "热量在沸腾，美味在尖叫！", fileName: "S30-元气零食.mp4" }
    ];

    const VIDEO_BASE_PATH = "videos/";
    let currentFilterText = "";

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderVideos() {
        const container = document.getElementById('videoContainer');
        const filteredList = videoList.filter(v => 
            v.title.toLowerCase().includes(currentFilterText.toLowerCase()) ||
            v.description.toLowerCase().includes(currentFilterText.toLowerCase())
        );

        if (filteredList.length === 0) {
            container.innerHTML = '<div class="no-result">😭 没有找到相关视频，试试其他关键词吧</div>';
            return;
        }

        let html = '';
        for (let v of filteredList) {
            const videoUrl = VIDEO_BASE_PATH + v.fileName;
            const safeTitle = escapeHtml(v.title);
            const safeDesc = escapeHtml(v.description);
            html += `
                <div class="video-card" data-video-url="${videoUrl}" data-title="${safeTitle}">
                    <video controls preload="none" poster="">
                        <source data-src="${videoUrl}" type="video/mp4">
                        您的浏览器不支持 video 标签。
                    </video>
                    <div class="video-info">
                        <div class="video-title">${safeTitle}</div>
                        <div class="video-desc">${safeDesc}</div>
                        <a href="${videoUrl}" download class="download-btn">⬇️ 下载视频</a>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        initLazyLoadAndAnimation();
        bindModalClick();
    }

    function initLazyLoadAndAnimation() {
        const cards = document.querySelectorAll('.video-card');
        if (!cards.length) return;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const card = entry.target;
                if (entry.isIntersecting) {
                    const videoEl = card.querySelector('video');
                    const sourceEl = videoEl?.querySelector('source');
                    const dataSrc = sourceEl?.getAttribute('data-src');
                    if (dataSrc && !videoEl.src) {
                        sourceEl.setAttribute('src', dataSrc);
                        videoEl.load();
                        videoEl.preload = 'metadata';
                        sourceEl.removeAttribute('data-src');
                    }
                    if (card.classList.contains('animate-in')) {
                        card.classList.remove('animate-in');
                        void card.offsetWidth;
                    }
                    card.classList.add('animate-in');
                } else {
                    if (card.classList.contains('animate-in')) {
                        card.classList.remove('animate-in');
                    }
                }
            });
        }, { rootMargin: "100px", threshold: 0.1 });

        cards.forEach(card => observer.observe(card));
    }

    function bindModalClick() {
        const modal = document.getElementById('videoModal');
        const modalVideo = document.getElementById('modalVideo');
        const closeModal = document.querySelector('.modal-close');
        const cards = document.querySelectorAll('.video-card');
        
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.closest('.download-btn')) return;
                const videoUrl = card.getAttribute('data-video-url');
                if (videoUrl) {
                    modalVideo.src = videoUrl;
                    modal.style.display = 'flex';
                    modalVideo.play();
                }
            });
        });
        
        if (!window.modalBound) {
            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
                modalVideo.pause();
                modalVideo.src = '';
            });
            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    modalVideo.pause();
                    modalVideo.src = '';
                }
            });
            window.modalBound = true;
        }
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function(e) {
        currentFilterText = e.target.value;
        renderVideos();
    });

    renderVideos();
</script>
</body>
</html>
