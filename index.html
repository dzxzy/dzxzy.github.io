    const VIDEO_BASE_PATH = "videos/";   // 视频文件夹路径

    function renderVideos() {
        const container = document.getElementById('videoContainer');
        if (!videoList.length) {
            container.innerHTML = '<div style="grid-column:1/-1; text-align:center;">暂无素材，稍后回来～</div>';
            return;
        }
        let html = '';
        for (let v of videoList) {
            const videoUrl = VIDEO_BASE_PATH + v.fileName;
            const safeTitle = escapeHtml(v.title);
            const safeDesc = escapeHtml(v.description);
            html += `
                <div class="video-card">
                    <video controls preload="metadata">
                        <source src="${videoUrl}" type="video/mp4">
                        您的浏览器不支持 video 标签。
                    </video>
                    <div class="video-info">

                        <div class="video-desc">${safeDesc}</div>
                        <a href="${videoUrl}" download class="download-btn">
                            ⬇️ 下载视频
                        </a>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
